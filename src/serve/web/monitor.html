<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q-Infer · Request monitor</title>
<link rel="stylesheet" href="/web/tokens.css">
<link rel="stylesheet" href="/web/components.css">
<link rel="stylesheet" href="/web/app.css">
<script>
  // First-frame theme and language: saved choices win, otherwise browser
  // defaults (see index.html for the same inline logic).
  try {
    var t = localStorage.getItem("qinfer.theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = t;
    var ql = localStorage.getItem("qinfer.lang");
    var nav = (navigator.language || "").toLowerCase();
    var lang = (ql === "zh" || ql === "en") ? ql : (nav.indexOf("zh") === 0 ? "zh" : "en");
    document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
  } catch (e) {}
</script>
</head>
<body>
<header class="st-header topbar">
  <span class="st-header__brand logo">Q-Infer <small data-i18n="apiMon.title">Request monitor /api-monitor</small></span>
  <span class="st-header__spacer"></span>
  <div class="keybox">
    <label for="api-key" data-i18n="apiMon.keyLabel">API key</label>
    <input id="api-key" class="input key-input" type="password" autocomplete="off" data-i18n-ph="apiMon.keyPh" placeholder="optional">
    <button id="btn-key-toggle" class="btn ghost" type="button" data-i18n="about.show">Show</button>
  </div>
  <a class="btn ghost" href="/" data-i18n="apiMon.back">Back to main panel</a>
  <button class="st-btn st-btn--icon" id="btn-lang" type="button" data-i18n-title="lang.title">EN</button>
  <button class="st-btn st-btn--icon" id="btn-theme" type="button" data-i18n-title="theme.title">
    <svg class="st-icon"><use id="theme-icon" href="/web/sprite.svg#i-moon"/></svg></button>
</header>
<main>
  <div class="req-layout" style="height:calc(100vh - 60px);max-height:none">
    <div class="req-list-pane" style="width:42%;min-width:280px">
      <div class="req-toolbar">
        <input id="req-search" class="input" type="search" data-i18n-ph="mon.searchPh" placeholder="Search path / model / state">
        <select id="req-filter" class="input" data-i18n-title="mon.filterTitle">
          <option value="" data-i18n="mon.all">All states</option>
          <option value="queued" data-i18n="filter.queued">queued</option>
          <option value="completed" data-i18n="filter.completed">completed</option>
          <option value="error" data-i18n="filter.error">error</option>
        </select>
      </div>
      <div id="req-list" class="req-list"><div class="note" data-i18n="mon.noReq">No requests yet</div></div>
    </div>
    <div id="req-detail" class="req-detail-pane"><div class="note" data-i18n="mon.pickHint">Pick a request on the left to inspect it</div></div>
  </div>
</main>
<div class="st-toasts" id="toasts" aria-live="polite"></div>
<script>window.__apiMonitorPage = true;</script>
<script src="/web/app.js"></script>
<script src="/web/monitor.js"></script>
</body>
</html>
